@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap');
.tk-outer{background:#F4EFF7;min-height:100vh;min-height:100dvh}
.tk{--bg:#F4EFF7;--surface:#FFFDFE;--ink:#2A2033;--muted:#857892;--line:#E4DCEA;--rose:#E4708A;--sage:#86BFA0;
  font-family:'Figtree',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:460px;margin:0 auto;font-size:16px;line-height:1.4}
.tk *{box-sizing:border-box}
.tk button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tk button:focus-visible,.tk textarea:focus-visible,.tk label:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.tk-main{flex:1;padding:calc(14px + env(safe-area-inset-top)) 20px 28px}

.tk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tk-head-left{justify-content:flex-start}
.tk-headmid{text-align:center;flex:1}
.tk-headmid.left{text-align:left}
.tk-title{font-family:'Instrument Serif',Georgia,serif;font-size:40px;line-height:1.05;letter-spacing:-.01em}
.tk-sub{color:var(--muted);font-size:14px;margin-top:2px}
.tk-status{margin-left:10px;font-size:12px;opacity:.8}
.tk-icon{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center}
.tk-icon:disabled{opacity:.25;cursor:default}

.tk-ring{position:relative;width:236px;margin:6px auto 0}
.tk-ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 46px}
.tk-phase{font-family:'Instrument Serif',Georgia,serif;font-size:36px;line-height:1}
.tk-phase.small{font-size:28px}
.tk-daycount{color:var(--muted);font-size:14px;margin-top:6px}
.tk-blurb{text-align:center;color:var(--muted);font-size:14px;margin:8px auto 0;max-width:280px}
.tk-center{display:flex;justify-content:center;margin-top:16px}
.tk-pill{min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--rose);background:transparent;font-size:15px;font-weight:500;color:var(--rose)!important}
.tk-pill.on{background:var(--rose);color:#fff!important}
.tk-upcoming{display:flex;justify-content:center;gap:28px;margin:16px 0 0;text-align:center}
.tk-upcoming dt{font-size:12px;color:var(--muted)}
.tk-upcoming dd{margin:2px 0 0;font-weight:600;font-size:15px}

.tk-sec{margin-top:40px}
.tk-sec h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:30px;line-height:1.1;margin:0 0 14px}
.tk-q{font-size:14px;color:var(--muted);margin:18px 0 10px}

.tk-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tk-slot{position:relative;text-align:center}
.tk-photo{position:relative;display:block;aspect-ratio:3/4;border-radius:18px;border:1.5px dashed #CDBFDA;background:var(--surface);overflow:hidden;cursor:pointer}
.tk-photo.has{border-style:solid;border-color:transparent}
.tk-photo img{width:100%;height:100%;object-fit:cover;display:block}
.tk-photo input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tk-cam{position:absolute;inset:0;display:grid;place-items:center;color:#A797B8}
.tk-cap{font-size:13px;color:var(--muted);margin-top:6px}
.tk-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(42,32,51,.72);color:#fff!important;display:grid;place-items:center}

.tk-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tk-dot{background:none;border:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px}
.tk-dot span{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid transparent;transition:transform .15s}
.tk-dot em{font-style:normal;font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.tk-dot.on span{border-color:var(--ink);transform:scale(1.14)}
.tk-dot.on em{color:var(--ink);font-weight:600}

.tk-field{display:block;margin-bottom:12px}
.tk-field span{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.tk-field textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;min-height:64px}
.tk-field textarea::placeholder{color:#B2A6BE}
.tk-chips{display:flex;flex-wrap:wrap;gap:8px}
.tk-chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.tk-chip.on{background:var(--ink);border-color:var(--ink);color:#fff!important}

.tk-move{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tk-move-name{flex:1;font-weight:500}
.tk-step{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tk-move-val{width:64px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.tk-total{margin:12px 0 0;color:var(--muted);font-size:14px;text-align:right}

.tk-seg{display:flex;background:#E9E1EF;border-radius:14px;padding:4px;gap:4px}
.tk-seg button{flex:1;min-height:44px;border:none;background:transparent;border-radius:11px;font-size:15px;font-weight:500;color:var(--muted)!important}
.tk-seg button.on{background:var(--surface);color:var(--ink)!important;box-shadow:0 1px 3px rgba(42,32,51,.12)}
.tk-seg.four button{font-size:13px;padding:0 2px}

.tk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.tk-wk{margin-top:14px}
.tk-wk span{text-align:center;font-size:12px;color:var(--muted)}
.tk-day{aspect-ratio:1;border-radius:14px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.tk-day b{font-weight:500;font-size:15px}
.tk-day i{width:7px;height:7px;border-radius:50%;display:block}
.tk-day.today{border-color:var(--ink)}
.tk-day.per{background:#E4708A!important;border-color:#E4708A}
.tk-day.per b{color:#fff;font-weight:700}
.tk-editrow{margin:4px 0 0}
.tk-hint{text-align:center;font-size:14px;color:var(--muted);margin:10px 0 0}
.tk-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:16px;font-size:13px;color:var(--muted)}
.tk-legend.left{justify-content:flex-start;margin-top:8px}
.tk-legend span{display:flex;align-items:center;gap:6px}
.tk-legend i{width:10px;height:10px;border-radius:50%;display:block}
.tk-note{font-size:13px;color:var(--muted);margin:14px 0 0}
.tk-note.tight{margin:-4px 0 12px}
.tk-empty{color:var(--muted);margin:24px 0}
.tk-empty.small{font-size:14px;margin:16px 0 0}

.tk-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tk-bar-name{width:82px;font-size:14px}
.tk-track{flex:1;height:10px;background:#E9E1EF;border-radius:6px;overflow:hidden}
.tk-track div{height:100%;border-radius:6px}
.tk-bar-val{width:26px;text-align:right;font-weight:600;font-size:14px}
.tk-bar-n{width:30px;font-size:12px;color:var(--muted)}

.tk-rows{margin-top:16px}
.tk-row{padding:10px 0;border-bottom:1px solid var(--line)}
.tk-row-top{display:flex;justify-content:space-between;font-weight:500}
.tk-row-top .worse{color:#B23A58;font-weight:600}
.tk-row-top .better{color:#4E8F6C;font-weight:600}
.tk-diff{position:relative;height:8px;background:#E9E1EF;border-radius:4px;margin:8px 0 4px}
.tk-diff::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted);opacity:.5}
.tk-diff div{position:absolute;top:0;bottom:0;border-radius:4px}
.tk-row-n{font-size:12px;color:var(--muted)}

.tk-strip{display:flex;gap:10px;overflow-x:auto;padding:14px 0 4px;margin:0 -20px;padding-left:20px;padding-right:20px;scroll-snap-type:x proximity}
.tk-strip button{flex:0 0 96px;background:none;border:none;padding:0;text-align:center;scroll-snap-align:start}
.tk-strip img{width:96px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.tk-strip span{font-size:12px;color:var(--muted);display:block;margin-top:5px}

.tk-btnrow{display:flex;gap:10px;margin-top:6px}
.tk-btn{position:relative;flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;overflow:hidden;cursor:pointer}
.tk-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

.tk-nav{position:sticky;bottom:0;display:flex;background:rgba(244,239,247,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.tk-nav button{flex:1;min-height:52px;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)!important;font-size:12px;font-weight:500}
.tk-nav button.on{color:var(--ink)!important}

@media (prefers-reduced-motion:reduce){.tk *{transition:none!important}}
